# Compila o plugin de DAW (plugin/) para Windows e macOS e testa o envio de ponta a ponta.
# Gera os instaladores (Windows .exe, Mac .pkg) e os zips. Os arquivos ficam em "Artifacts".
# Todo push no main republica o Release "plugin-latest", que é para onde o site (/plugin) aponta.
# Uma tag plugin-v* (ex.: plugin-v0.2.0) publica também uma versão fixa.
name: Plugin de DAW

on:
  push:
    paths: ['plugin/**', 'server/daw.mjs', 'server/discord.mjs', '.github/workflows/plugin.yml']
    tags: ['plugin-v*']
  workflow_dispatch:

jobs:
  teste:
    name: Teste de ponta a ponta (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxcomposite-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl-dev libssl-dev
          npm --prefix server ci
      - name: Compilar os testes
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNOVEAU_TESTS=ON
          cmake --build build --target packet_test stream_test
      - name: Testar
        run: node plugin/Tests/e2e.mjs build/stream_test_artefacts/Release/stream_test build/packet_test

  compilar:
    name: Compilar (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (Windows)
        if: matrix.name == 'windows'
        run: cmake -S plugin -B build -A x64
      - name: Configurar (macOS, Intel + Apple Silicon)
        if: matrix.name == 'macos'
        run: cmake -S plugin -B build -G Xcode "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Testar o formato dos pacotes
        shell: bash
        run: |
          mkdir -p pk
          if [ -f build/Release/packet_test.exe ]; then build/Release/packet_test.exe pk; else build/Release/packet_test pk; fi

      - name: Empacotar (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $out = "noveau-DAW-windows"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item -Recurse "build/NoveauDAW_artefacts/Release/VST3/noveau DAW.vst3" $out
          Copy-Item "build/NoveauDAW_artefacts/Release/Standalone/noveau DAW.exe" $out
          Copy-Item -Recurse "build/NoveauDAW_artefacts/Release/AAX/noveau DAW.aaxplugin" $out
          Copy-Item plugin/LEIA-ME.txt $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"

      - name: Instalador (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1
          }
          $version = (Select-String -Path plugin/CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          & $iscc.FullName "/DVersion=$version" "/DSource=$PWD\build\NoveauDAW_artefacts\Release\VST3" "/O$PWD" plugin\installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item noveau-DAW-Windows.exe

      - name: Empacotar (macOS)
        if: matrix.name == 'macos'
        run: |
          out=noveau-DAW-macos
          mkdir "$out"
          cp -R "build/NoveauDAW_artefacts/Release/VST3/noveau DAW.vst3" "$out/"
          cp -R "build/NoveauDAW_artefacts/Release/AU/noveau DAW.component" "$out/"
          cp -R "build/NoveauDAW_artefacts/Release/Standalone/noveau DAW.app" "$out/"
          cp -R "build/NoveauDAW_artefacts/Release/AAX/noveau DAW.aaxplugin" "$out/"
          cp plugin/LEIA-ME.txt "$out/"
          # Sem conta paga da Apple: assinatura "ad hoc" (o Apple Silicon exige alguma assinatura).
          for f in "$out"/*.vst3 "$out"/*.component "$out"/*.app "$out"/*.aaxplugin; do codesign --force --deep -s - "$f"; done
          ditto -c -k --keepParent "$out" "$out.zip"
          version=$(sed -nE 's/^project\(NoveauDAW VERSION ([0-9.]+).*/\1/p' plugin/CMakeLists.txt)
          plugin/installer/mac-pkg.sh "$out" "$version" noveau-DAW-Mac.pkg
          pkgutil --payload-files noveau-DAW-Mac.pkg | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: noveau-DAW-${{ matrix.name }}
          path: |
            noveau-DAW-${{ matrix.name }}.zip
            noveau-DAW-Windows.exe
            noveau-DAW-Mac.pkg

  publicar:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/plugin-v') || github.ref == 'refs/heads/main'
    needs: [teste, compilar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Mover a tag plugin-latest para este commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/plugin-latest" 2>/dev/null || true
          gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/plugin-latest -f sha=${{ github.sha }}
      - name: Release "plugin-latest" (o link fixo do site)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-latest
          name: Plugin de DAW (mais novo)
          body: |
            Instaladores do plugin de DAW, refeitos a cada atualização do main.
            Passo a passo: https://noveau.riajuu.net/plugin
          make_latest: false
          files: |
            noveau-DAW-Windows.exe
            noveau-DAW-Mac.pkg
            noveau-DAW-*.zip
      - name: Release da versão
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Plugin de DAW ${{ github.ref_name }}
          files: |
            noveau-DAW-Windows.exe
            noveau-DAW-Mac.pkg
            noveau-DAW-*.zip
